<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <title>سینماتیکت</title>
    <link rel="icon" href="https://cinematicket.org/assets/images/logo.png">
</head>

<body>

    <!-- header -->
    <header class="w-full pb-2 scale-85 flex m-1 mt-2 justify-between items-center border-b-1 border-b-zinc-300">
        <div class="flex md:gap-15">
            <div class="gap-0 flex w-screen justify-center md:w-auto h-auto">
                <img src="https://cinematicket.org/assets/images/logo.svg" alt="logo icon" class="w-auto">
                <img src="https://cinematicket.org/assets/images/typography_dark.svg" alt="logo" class="w-auto">
            </div>
            <div class="flex md:p-1 md:justify-between md:gap-5">
                <a href="#" class="!hidden md:!flex btn "><i data-lucide="popcorn"></i>
                    سینما ها
                </a>
                <input type="text" class="hidden lg:block search-input text-sm w-100"
                    placeholder="جست و جوی سینما، فیلم و...">
            </div>
        </div>
        <div class="">
            <a href="#" class="!hidden md:!flex btn"><i data-lucide="circle-user-round"></i>
                ورود یا ثبت نام
            </a>
        </div>
    </header>

    <!-- carousel -->
    <div class="swiper mySwiper md:w-[85%] overflow-hidden md:rounded-2xl mx-auto my-2">
        <div class="swiper-wrapper">
            <!-- Slide 1 -->
            <div class="swiper-slide relative">
                <img src="https://static.cdn.asset.cinematicket.org/media/cache/3d/12/3d12fe40bfdb3f7c7d3eb82f0a6c0e8c.webp"
                    class="w-full block">
                <div
                    class="hidden md:block absolute inset-0 bg-[linear-gradient(to_left,rgba(0,0,0,.9),rgba(0,0,0,.35)_45%,transparent_80%)]">
                </div>
                <div class="hidden lg:block absolute right-10 bottom-10 z-10 w-80 text-right text-white">
                    <span class="text-sm text-white/60">فیلم سینمایی</span>

                    <h2 class="mt-2 text-4xl font-bold">
                        عنوان فیلم
                    </h2>
                    <p class="mt-3 text-sm leading-7 text-white/70">
                        توضیح فیلم
                    </p>
                    <button class="mt-5 rounded-lg btn rose px-5 py-2.5 text-sm font-semibold text-black">خرید بلیت <i
                            data-lucide="chevron-left"></i>
                    </button>
                </div>
            </div>
            <!-- Slide 2 -->
            <div class="swiper-slide relative">
                <img src="https://static.cdn.asset.cinematicket.org/media/cache/f3/7d/f37de8cddaef4fb453dc9155fc632d57.webp"
                    class="w-full block">
                <div
                    class="hidden md:block absolute inset-0 bg-[linear-gradient(to_left,rgba(0,0,0,.9),rgba(0,0,0,.35)_45%,transparent_80%)]">
                </div>
                <div class="hidden lg:block absolute right-10 bottom-10 z-10 w-80 text-right text-white">
                    <span class="text-sm text-white/60">فیلم سینمایی</span>
                    <h2 class="mt-2 text-4xl font-bold">
                        عنوان فیلم
                    </h2>
                    <p class="mt-3 text-sm leading-7 text-white/70">
                        توضیح فیلم
                    </p>
                    <button class="mt-5 rounded-lg btn rose px-5 py-2.5 text-sm font-semibold text-black">خرید بلیت <i
                            data-lucide="chevron-left"></i>
                    </button>
                </div>
            </div>
            <!-- Slide 3 -->
            <div class="swiper-slide relative">
                <img src="https://static.cdn.asset.cinematicket.org/media/cache/39/59/395971d9002e2b68fea2cd75d548b044.webp"
                    class="w-full block">
                <div
                    class="hidden md:block absolute inset-0 bg-[linear-gradient(to_left,rgba(0,0,0,.9),rgba(0,0,0,.35)_45%,transparent_80%)]">
                </div>
                <div class="hidden lg:block absolute right-10 bottom-10 z-10 w-80 text-right text-white">
                    <span class="text-sm text-white/60">فیلم سینمایی</span>
                    <h2 class="mt-2 text-4xl font-bold">
                        عنوان فیلم
                    </h2>
                    <p class="mt-3 text-sm leading-7 text-white/70">
                        توضیح فیلم
                    </p>
                    <button class="mt-5 rounded-lg btn rose px-5 py-2.5 text-sm font-semibold text-black">خرید بلیت <i
                            data-lucide="chevron-left"></i>
                    </button>
                </div>
            </div>
        </div>
        <div class="swiper-button-prev !hidden md:!block"></div>
        <div class="swiper-button-next !hidden md:!block"></div>
        <div class="swiper-pagination !hidden md:!block"></div>
    </div>

    <!-- movies list -->
    <section class="section">
        <nav>
            <h3 class="">فیلم های ایرانی</h3>
            <a href="#" class="!hidden md:!flex btn">مشاهده همه <i data-lucide="chevron-left"></i></a>
        </nav>
        <div>
            <article class="relative overflow-hidden rounded-xl">
                <img src="https://static.cdn.asset.cinematicket.org/media/cache/cb/ea/cbea3a0de01a3eea661eddc3aa130352.webp"
                    class="h-50 sm:h-60 md:h-80 w-full object-cover" />
                <div
                    class="absolute inset-0 flex items-end justify-center bg-black/40 hover:bg-black/70 transition whitespace-nowrap p-3 font-bold text-white">
                    <p class="text-center">عنوان فیلم</p>
                </div>
            </article>
            <article class="relative overflow-hidden rounded-xl">
                <img src="https://static.cdn.asset.cinematicket.org/media/cache/cb/ea/cbea3a0de01a3eea661eddc3aa130352.webp"
                    class="h-50 sm:h-60 md:h-80 w-full object-cover" />
                <div
                    class="absolute inset-0 flex items-end justify-center bg-black/40 hover:bg-black/70 transition whitespace-nowrap p-3 font-bold text-white">
                    <p class="text-center">عنوان فیلم</p>
                </div>
            </article>
            <article class="relative overflow-hidden rounded-xl">
                <img src="https://static.cdn.asset.cinematicket.org/media/cache/cb/ea/cbea3a0de01a3eea661eddc3aa130352.webp"
                    class="h-50 sm:h-60 md:h-80 w-full object-cover" />
                <div
                    class="absolute inset-0 flex items-end justify-center bg-black/40 hover:bg-black/70 transition whitespace-nowrap p-3 font-bold text-white">
                    <p class="text-center">عنوان فیلم</p>
                </div>
            </article>
            <article class="relative overflow-hidden rounded-xl">
                <img src="https://static.cdn.asset.cinematicket.org/media/cache/cb/ea/cbea3a0de01a3eea661eddc3aa130352.webp"
                    class="h-50 sm:h-60 md:h-80 w-full object-cover" />
                <div
                    class="absolute inset-0 flex items-end justify-center bg-black/40 hover:bg-black/70 transition whitespace-nowrap p-3 font-bold text-white">
                    <p class="text-center">عنوان فیلم</p>
                </div>
            </article>
            <article class="relative overflow-hidden rounded-xl">
                <img src="https://static.cdn.asset.cinematicket.org/media/cache/cb/ea/cbea3a0de01a3eea661eddc3aa130352.webp"
                    class="h-50 sm:h-60 md:h-80 w-full object-cover" />
                <div
                    class="absolute inset-0 flex items-end justify-center bg-black/40 hover:bg-black/70 transition whitespace-nowrap p-3 font-bold text-white">
                    <p class="text-center">عنوان فیلم</p>
                </div>
            </article>
            <article class="relative overflow-hidden rounded-xl">
                <img src="https://static.cdn.asset.cinematicket.org/media/cache/cb/ea/cbea3a0de01a3eea661eddc3aa130352.webp"
                    class="h-50 sm:h-60 md:h-80 w-full object-cover" />
                <div
                    class="absolute inset-0 flex items-end justify-center bg-black/40 hover:bg-black/70 transition whitespace-nowrap p-3 font-bold text-white">
                    <p class="text-center">عنوان فیلم</p>
                </div>
            </article>
            <article class="relative overflow-hidden rounded-xl">
                <img src="https://static.cdn.asset.cinematicket.org/media/cache/cb/ea/cbea3a0de01a3eea661eddc3aa130352.webp"
                    class="h-50 sm:h-60 md:h-80 w-full object-cover" />
                <div
                    class="absolute inset-0 flex items-end justify-center bg-black/40 hover:bg-black/70 transition whitespace-nowrap p-3 font-bold text-white">
                    <p class="text-center">عنوان فیلم</p>
                </div>
            </article>
        </div>
    </section>


    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script>
        new Swiper(".mySwiper", {
            loop: true,

            autoplay: {
                delay: 4000,
            },

            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },

            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },

            direction: "horizontal",
        })
    </script>


</body>

</html>
